name: Build Debug APK

# GitHub에 push할 때마다(main 브랜치) 자동으로 디버그 APK를 빌드합니다.
# Actions 탭 > 이 워크플로 실행 결과 > Artifacts 에서 "EuroJackpotAI-debug-apk"를
# 다운로드하면 됩니다 (zip 안에 .apk 파일이 들어있음). 수동으로 돌리고 싶으면
# Actions 탭에서 "Run workflow" 버튼(workflow_dispatch)을 누르면 됩니다.
#
# 디버그 APK는 AGP가 자동 생성하는 디버그 키로 서명되므로 별도 서명 키 설정이
# 필요 없습니다 — 테스트/설치용으로 충분합니다. Play 스토어 배포용 서명된
# release APK가 필요해지면 이 파일에 keystore 관련 secrets/스텝을 추가하면 됩니다.

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build-debug-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      # android-actions/setup-android@v3 is skipped: it tries to (re-)install the legacy
      # "tools" package, which no longer exists in the SDK repository, and fails the job
      # with exit code 1. ubuntu-latest runners already ship a recent Android SDK with
      # sdkmanager on PATH, so we just accept the licenses and install what we need directly.
      - name: Accept Android SDK licenses & install required packages (compileSdk 36)
        run: |
          export PATH="$PATH:$ANDROID_HOME/cmdline-tools/latest/bin:$ANDROID_HOME/platform-tools"
          yes | sdkmanager --licenses || true
          sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      # local.properties는 git에 커밋되지 않으므로(.gitignore) CI에서 직접 만들어줌.
      # LOTTO_API_KEY secret을 등록 안 해도 build.gradle.kts가 빈 값으로 안전하게
      # 폴백해서(샘플 데이터 모드) 빌드는 항상 성공합니다. 실제 키를 쓰고 싶으면
      # 저장소 Settings > Secrets and variables > Actions 에서 LOTTO_API_KEY를
      # 등록하세요.
      - name: Write local.properties
        run: echo "LOTTO_API_KEY=${{ secrets.LOTTO_API_KEY }}" > local.properties

      - name: Build debug APK
        run: ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: EuroJackpotAI-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
